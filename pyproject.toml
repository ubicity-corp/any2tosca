[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
#build-backend = "setuptools.backends.legacy:build"

[project]
name = "any2tosca"
version = "0.1.0"
description = "Convert JSON Schema files to TOSCA data types"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["tosca", "json-schema", "converter", "cloud", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "referencing>=0.28.0",
    "pyang>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build",
    "twine",
]

[project.scripts]
any2tosca = "any2tosca.cli:cli_entry"
redfish2tosca = "any2tosca.cli:redfish_entry"
oas2tosca = "any2tosca.cli:oas_entry"
yang2tosca = "any2tosca.cli:yang_entry"

[project.urls]
Homepage = "https://github.com/your-org/any2tosca"
Issues   = "https://github.com/your-org/any2tosca/issues"

[tool.setuptools.packages.find]
# where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
