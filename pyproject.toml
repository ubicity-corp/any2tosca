[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "any2tosca"
version = "0.1.0"
description = "Convert JSON Schema, OpenAPI (including the Kubernetes specification), Redfish and YANG schemas to TOSCA 2.0 node types and data types"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ubicity Corp.", email = "info@ubicity.com" },
]
requires-python = ">=3.10"
keywords = ["tosca", "json-schema", "openapi", "kubernetes", "redfish", "yang", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "referencing>=0.28.0",
    "pyang>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build",
    "twine",
]

[project.scripts]
any2tosca = "any2tosca.cli:cli_entry"
redfish2tosca = "any2tosca.cli:redfish_entry"
oas2tosca = "any2tosca.cli:oas_entry"
yang2tosca = "any2tosca.cli:yang_entry"

[project.urls]
Homepage = "https://github.com/ubicity-corp/any2tosca"
Documentation = "https://github.com/ubicity-corp/any2tosca/blob/master/README.md"
Changelog = "https://github.com/ubicity-corp/any2tosca/blob/master/CHANGELOG.md"
Issues   = "https://github.com/ubicity-corp/any2tosca/issues"

[tool.setuptools.packages.find]
include = ["any2tosca*"]

[tool.setuptools.package-data]
any2tosca = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
