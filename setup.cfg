[aliases]
release = bdist_wheel
test = pytest

[metadata]
name = json2tosca
version = attr: json2tosca.__version__
summary = Convert JSON Schema files to TOSCA Profiles
description_file = README.md
description_content_type = text/markdown
author = Chris Lauwers
author_email = lauwers@ubicity.com
home_page = https://github.com/lauwers/json2tosca
license = Apache License Version 2.0
classifier =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9

[options.entry_points]
console_scripts =
    json2tosca = json2tosca.cli:cli_entry
    redfish2tosca = json2tosca.cli:redfish_entry
    oas2tosca = json2tosca.cli:oas_entry

[options]
packages = json2tosca
install_requires =
    ruamel.yaml
